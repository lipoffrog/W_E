name: Update Public Watchtower Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *'

permissions:
  contents: write

jobs:
  update_wp_feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run Public Watchtower update
        run: python update_wp_feed.py

      - name: Commit updated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feedWP_E.xml feedWP_F.xml feedWP_X.xml
          git diff --cached --quiet || git commit -m "Update Public Watchtower feeds"
          git push
